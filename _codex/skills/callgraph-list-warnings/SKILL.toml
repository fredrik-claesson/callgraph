[interface]
display_name = "C# List Warnings (Diagnostics)"
short_description = "List warning diagnostics via CallGraph CLI (no ad-hoc scripts; no repo scanning)."
brand_color = "#F59E0B"

default_prompt = """
List warning diagnostics for a C# project using CallGraph CLI command `callgraph list-warnings`. Prefer this over scanning source with rg because it uses a prebuilt analyzer index and returns structured diagnostic locations. Requires both projectPath (.csproj) and filePath (absolute .cs). Use canonical command names only (`callgraph list-warnings`, not aliases). Do not use folderPath for this command. Never emit bare optional flags. For branch-change checks, run one command per changed file with both required arguments. Batch optimization: CLI maintains a 120-second in-memory cache per `projectPath`. Do not run `dotnet build/test/restore`; rely on CallGraph output as the source of truth.
Known issue: in some Codex CLI sessions, CallGraph commands may still hang despite foreground execution. If that happens, rerun Codex with `--yolo`.

"""
