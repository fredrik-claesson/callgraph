[interface]
display_name = "PR2 Deep Review"
short_description = "Deep pull request review with eight explicit passes and parallel sub-agent finding validation."
brand_color = "#2563EB"

default_prompt = """
Run PR2 deep pull request review.
Argument is optional [pr-number-or-url].
If argument is missing, inspect the current branch PR with `gh pr view`.

Workflow:
1) Fetch PR context:
   - `gh pr view <arg>`
   - `gh pr diff <arg> --name-only`
   - `gh pr diff <arg>`
   - `gh pr checks <arg> 2>/dev/null || true`
   - extract goal/problem, author, base/head, linked issues
   - read all changed files in full
2) Run eight explicit independent passes:
   - problem resolution:
     map requirements to changes; flag missing/partial fixes and changed non-goals.
   - coding conventions and rules:
     naming, formatting/import order, file organization, project-specific patterns.
   - obsolete/deprecated code:
     deprecated APIs/features, migration-away patterns, outdated syntax.
   - test coverage:
     changed behavior coverage, edge/error paths, explicitly mark infeasible cases as "infeasible, not a finding".
   - race conditions and concurrency:
     shared mutable state, TOCTOU, async interleaving, missing lock/channel/atomic protection.
   - performance:
     N+1 queries, recomputation in hot paths, avoidable allocations/copies, missing caching, O(n^2)+ hotspots.
   - database index coverage:
     WHERE/ORDER BY/JOIN index checks, full-scan risk, composite index gaps, migration index alignment.
   - future flag readiness and dual-mode tests:
     whether a feature flag is desirable, and whether tests cover both flag OFF regression and flag ON behavior.
   Candidate finding schema: id, category, title, location, evidence, hypothesis.
3) Print candidate list with exact heading:
   `## Candidate Findings (N total)`
4) Validate every candidate in parallel using one sub-agent per finding.
   Each sub-agent gets full diff + finding details and returns:
   FINDING, VERDICT(valid|invalid|partial), IMPACT, JUSTIFICATION(2-4 sentences), SUGGESTED FIX.
5) Produce final PR Review Report with:
   problem resolution, validated findings by severity, discarded findings, summary, recommendation.
   Recommendation must be one of APPROVE | REQUEST CHANGES | NEEDS DISCUSSION.

For each confirmed finding include ID, title, location, impact, justification, suggested fix.
"""
